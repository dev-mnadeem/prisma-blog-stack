server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routing: /posts/<id> is not a file on disk.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
